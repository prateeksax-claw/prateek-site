name: Deploy to Cloudflare Pages

# Auto-deploys the static site to the Cloudflare Pages project "prateeksaxena".
# The project's PRODUCTION branch is "main", so a push to master is deployed
# with --branch=main to publish to production.
# - push to master -> production (prateeksaxena.pages.dev)
# - push to dev     -> preview   (dev.prateeksaxena.pages.dev)
# Requires repo secret CLOUDFLARE_NEW (Account > Cloudflare Pages > Edit).

on:
  push:
    branches: [master, dev]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_NEW }}
          accountId: 89f078613042c984a12a174f10b2611f
          command: >-
            pages deploy .
            --project-name=prateeksaxena
            --branch=${{ github.ref_name == 'master' && 'main' || github.ref_name }}
            --commit-hash=${{ github.sha }}

      # Notify IndexNow (Bing and partners) about the current sitemap URLs.
      # The key is public by design; the matching key file is served at the site root.
      - name: Notify IndexNow
        if: github.ref_name == 'master'
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<\/*loc>//g' | jq -R . | jq -cs .)
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"prateeksaxena.me\",\"key\":\"7e4a4aded28b22d590da634a8050a22c\",\"keyLocation\":\"https://prateeksaxena.me/7e4a4aded28b22d590da634a8050a22c.txt\",\"urlList\":$urls}" \
            -o /dev/null -w "IndexNow HTTP %{http_code}\n" || true
